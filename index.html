<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抗菌药物分级管理制度闭环管理系统 · 原型演示</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app"></div>

  <!-- 框架 -->
  <script src="lib/vue.global.prod.js"></script>

  <!-- 配置层（HAPI 服务端地址可配置）与 FHIR 通信层：顺序即依赖顺序 -->
  <script src="js/config.js"></script>
  <script src="js/fhir-r4.js"></script>
  <script src="js/fhir-client.js"></script>

  <!-- 数据层：FHIR 资源库（本地镜像 + 异步写穿）+ 扩展机制 + 领域常量 -->
  <script src="js/fhir-store.js"></script>
  <script src="js/fhir-ext.js"></script>
  <script src="js/domain.js"></script>
  <!-- 演示时钟（24 小时补审核与超时判定唯一时源）与审批/授权引擎 -->
  <script src="js/clock.js"></script>
  <script src="js/approval.js"></script>
  <!-- 资源定义（StructureDefinition）+ 种子数据 + 服务层 -->
  <script src="js/fhir-profiles.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/services.js"></script>

  <!-- 应用引导（先创建共享的 App / AMS 注册表，再加载组件填充） -->
  <script src="js/app.js"></script>

  <!-- 页面组件 -->
  <script src="js/components/common.js"></script>
  <script src="js/components/home.js"></script>
  <script src="js/components/catalog.js"></script>
  <script src="js/components/indication.js"></script>
  <script src="js/components/grade-rules.js"></script>
  <script src="js/components/physician-perm.js"></script>
  <script src="js/components/perm-mapping.js"></script>
  <script src="js/components/workflow-designer.js"></script>
  <script src="js/components/workflow-versions.js"></script>
  <script src="js/components/workflow-config.js"></script>
  <script src="js/components/order-demo.js"></script>
  <script src="js/components/emergency-review.js"></script>
  <script src="js/components/auth-apply.js"></script>
  <script src="js/components/approval-center.js"></script>
  <script src="js/components/mobile-approval.js"></script>
  <script src="js/components/auth-approve.js"></script>
  <script src="js/components/monitor.js"></script>
  <script src="js/components/report.js"></script>
  <script src="js/components/gatekeep.js"></script>
  <script src="js/components/sys-params.js"></script>
  <script src="js/components/demo-data.js"></script>

  <!-- 启动应用 -->
  <script>window.__BOOT_AMS__();</script>
</body>
</html>
